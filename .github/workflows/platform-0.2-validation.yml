name: Platform 0.2 read-only validation
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'lib/**'
      - 'tests/**'
      - 'scripts/**'
      - 'content/public/**'
      - 'atlas-utils.mjs'
      - 'rival-model.mjs'
      - 'workspace.js'
      - 'workspace.css'
      - 'index.html'
      - '.github/workflows/platform-0.2-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test tests/*.test.cjs
      - name: Approved public records
        run: node scripts/validate-public-records.cjs
